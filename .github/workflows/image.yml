# Construit l'image de Foldbook Server pour Intel et ARM (les NAS Synology récents sont en
# x86_64, d'autres NAS et les Raspberry Pi en ARM), et la publie sur ghcr.io.
name: Image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/milrer/foldbook-server:latest
            ghcr.io/milrer/foldbook-server:${{ steps.version.outputs.v }}
          labels: |
            org.opencontainers.image.source=https://github.com/Milrer/foldbook-server
            org.opencontainers.image.description=Foldbook Server : prête la bibliothèque d'un NAS aux personnes invitées.
